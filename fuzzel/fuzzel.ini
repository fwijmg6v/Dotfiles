[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=auto

prompt=" ❯  "
placeholder=Search...

lines=8
width=35
horizontal-pad=24
vertical-pad=16
inner-pad=10
letter-spacing=0

icon-theme=
icons-enabled=yes
image-size-ratio=0.5

terminal=ghostty

[colors]
# RRGGBBAA -- alpha last. Slight transparency on background so Hyprland's
# own blur (already configured) shows through it, matching the ghostty/
# hyprland "frosted glass" look instead of a flat opaque box.
background=090A0Fe6
text=E6F0FAff
match=BCE3FFff
selection=212830ff
selection-text=E6F0FAff
selection-match=BCE3FFff
border=BCE3FFff
placeholder=6E7A8Aff
counter=6E7A8Aff

[border]
width=2
radius=4
selection-radius=2

[dmenu]
# When invoked as `fuzzel --dmenu` from a script (power menu, etc.)
exit-immediately-if-empty=yes


