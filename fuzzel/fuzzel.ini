[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=auto

prompt=" ❯  "
placeholder=Search...

lines=8
width=35
horizontal-pad=24
vertical-pad=16
inner-pad=10
letter-spacing=0

icon-theme=
icons-enabled=yes
image-size-ratio=0.5

terminal=ghostty

[colors]
# RRGGBBAA -- alpha last. Same tint as the eww $bar (rgba(9,10,15,0.45)), frosted
# by the "fuzzel-blur" layer rule in hypr/modules/windowrules.lua. Keep the
# alpha above that rule's ignore_alpha (0.3 = 4d) or the blur drops out.
background=090A0F73
text=E6F0FAff
match=BCE3FFff
selection=212830ff
selection-text=E6F0FAff
selection-match=BCE3FFff
border=BCE3FFff
placeholder=6E7A8Aff
counter=6E7A8Aff

[border]
width=2
radius=4
selection-radius=2

[dmenu]
# When invoked as `fuzzel --dmenu` from a script (power menu, etc.)
exit-immediately-if-empty=yes


