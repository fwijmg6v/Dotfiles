# Inside tmux: a terminfo that supports italics, 256 colours etc.
set -g default-terminal "tmux-256color"

# Outer terminal features (ghostty, or anything 256-colour as a fallback):
#   RGB       -> pass 24-bit true colour through
#   clipboard -> forward OSC 52 to the outer terminal
set -as terminal-features ",xterm-ghostty:RGB:clipboard"
set -as terminal-features ",*-256color:RGB:clipboard"

# OSC 52: copy-mode yanks and apps inside tmux (nvim, ...) set the system clipboard
set -s set-clipboard on

# Mouse drag selects and copies (via OSC 52); hold Shift for ghostty's own selection
set -g mouse on
